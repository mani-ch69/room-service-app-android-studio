<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Room Service - Guest Portal</title>
    <link rel="stylesheet" href="style.css?v=1.4">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
</head>
<body>
    <div id="app">
        <!-- HEADER -->
        <header class="premium-header">
            <div class="header-main">
                <div class="logo-section">
                    <h1 class="app-logo">Room Service</h1>
                </div>
                <div class="header-actions">
                    <div id="btn-cart" class="cart-icon-container" style="cursor:pointer;">
                        <div style="position:relative;">
                            <svg viewBox="0 0 24 24" width="24" height="24" stroke="var(--primary-blue)" stroke-width="2.5" fill="none"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"></path></svg>
                            <span id="cart-badge" class="hidden">0</span>
                        </div>
                    </div>
                    <div id="btn-more-menu" class="more-menu-container" style="cursor:pointer; margin-left: 12px;">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="var(--text-medium)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                    </div>
                </div>
            </div>

            <!-- OPTIONS MENU POPUP -->
            <div id="options-popup" class="options-popup hidden">
                <div class="popup-header">
                    <div class="hotel-avatar">🏢</div>
                    <div>
                        <h4 id="popup-hotel-name">Hotel Name</h4>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <p id="popup-hotel-id" style="font-size: 0.7rem; background: var(--bg-light); padding: 2px 6px; border-radius: 4px;">ID: ---</p>
                            <p id="popup-room-number" style="font-size: 0.75rem; color: var(--primary-blue); font-weight: 800;">Room --</p>
                        </div>
                    </div>
                </div>
                <div class="popup-divider"></div>
                <div class="popup-item" onclick="switchSection('settings')">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    <span>Settings</span>
                </div>
            </div>

            <!-- MAIN TABS -->
            <div class="main-tabs">
                <div id="tab-restaurant" class="tab-item active" onclick="switchMainTab('restaurant')">Restaurant</div>
                <div id="tab-shop" class="tab-item" onclick="switchMainTab('shop')">Shop</div>
            </div>
        </header>

        <main class="content">
            <!-- RESTAURANT SECTION -->
            <div id="section-restaurant">
                <div id="res-categories" class="category-scroll">
                    <!-- Categories injected here as tabs -->
                </div>
                <div id="res-menu-list" class="menu-list">
                    <!-- Items injected here -->
                </div>
            </div>

            <!-- ORDERS SECTION -->
            <div id="section-orders" class="hidden" style="padding: 16px 16px 100px 16px;">
                <h2 style="margin-bottom:20px; font-weight:800;">My Orders</h2>
                <div id="orders-timeline-list" style="display:flex; flex-direction:column; gap:20px;">
                    <!-- Real-time Order lifecycle injected here -->
                </div>
            </div>

            <!-- SHOP SECTION -->
            <div id="section-shop" class="hidden">
                <div style="text-align:center; padding:40px; color:var(--text-medium);">
                    <div style="font-size:48px; margin-bottom:16px;">🛍️</div>
                    <p>Shop products coming soon!</p>
                </div>
            </div>

            <!-- MESSAGES SECTION -->
            <div id="section-messages" class="hidden" style="height: calc(100vh - 180px); display: flex; flex-direction: column;">
                <div id="chat-messages-container" style="flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
                    <!-- Messages will be injected here -->
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Type a message...">
                    <button id="btn-send-chat">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>
        </main>

        <!-- FLOATING CART BAR -->
        <div id="floating-cart-bar" class="hidden">
            <div class="cart-bar-content">
                <div class="cart-info">
                    <span id="cart-item-count">0 Items</span>
                    <span class="dot">·</span>
                    <span id="cart-total-price">₹0</span>
                </div>
                <button id="btn-go-to-cart" class="btn-place-order">
                    VIEW CART ❯
                </button>
            </div>
        </div>

        <!-- CART MODAL -->
        <div id="cart-modal" class="modal hidden">
            <div class="modal-content card">
                <div class="modal-header">
                    <h2>Your Order</h2>
                    <span id="btn-close-cart" class="close-icon">&times;</span>
                </div>
                <div id="cart-items-list" class="item-list"></div>

                <div class="payment-section" style="margin-top: 20px; margin-bottom: 20px;">
                    <h3 style="font-size: 1rem; font-weight: 800; margin-bottom: 12px;">Payment Method</h3>
                    <div class="payment-options" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <label class="pay-option">
                            <input type="radio" name="pay-method" value="Cash" checked>
                            <div class="pay-card">💵 Cash</div>
                        </label>
                        <label class="pay-option">
                            <input type="radio" name="pay-method" value="UPI">
                            <div class="pay-card">📲 UPI</div>
                        </label>
                        <label class="pay-option">
                            <input type="radio" name="pay-method" value="Card">
                            <div class="pay-card">💳 Card</div>
                        </label>
                        <label class="pay-option">
                            <input type="radio" name="pay-method" value="PayPal">
                            <div class="pay-card">🅿️ PayPal</div>
                        </label>
                    </div>
                </div>

                <div class="bill-details card">
                    <div class="bill-row"><span>Subtotal</span><span id="bill-subtotal">₹0</span></div>
                    <div class="bill-row"><span>GST (5%)</span><span id="bill-tax">₹0</span></div>
                    <div class="bill-row grand-total"><span>Grand Total</span><span id="bill-grand-total">₹0</span></div>
                </div>
                <button id="btn-place-final-order" class="btn btn-blue full-width">PLACE ORDER</button>
            </div>
        </div>

        <!-- SUCCESS MODAL -->
        <div id="success-modal" class="modal hidden">
            <div class="modal-content card success-card">
                <div class="success-icon">✨</div>
                <h2>Order Confirmed!</h2>
                <p>Order ID: <span id="success-order-id">#---</span></p>
                <button id="btn-success-close" class="btn btn-blue full-width">OKAY</button>
            </div>
        </div>

        <!-- BOTTOM NAV (Simplified) -->
        <nav class="bottom-nav">
            <div class="nav-item active" onclick="switchSection('home')">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Home</span>
            </div>
            <div class="nav-item" onclick="switchSection('orders')">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                <span>Orders</span>
            </div>
            <div class="nav-item" onclick="switchSection('messages')">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <span>Chat</span>
            </div>
        </nav>
    </div>
    <script src="app.js?v=1.4"></script>
</body>
</html>
